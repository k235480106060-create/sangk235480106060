<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Website 2 - Gọi API Node-RED</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #eef2f3; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f8f9fa; margin: 5px 0; padding: 10px; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Danh sách sinh viên (Lấy từ API Node-RED)</h2>
        <button onclick="layDanhSachSinhVien()">Tải dữ liệu API</button>
        <p id="status"></p>
        <ul id="danhSach"></ul>
    </div>

    <script>
        async function layDanhSachSinhVien() {
            const statusEl = document.getElementById('status');
            const listEl = document.getElementById('danhSach');
            statusEl.innerText = 'Đang gọi API...';
            listEl.innerHTML = '';

            try {
                // Gọi API Node-RED qua đường dẫn proxy
                const response = await fetch('/api/tacke');
                const data = await response.json();

                if (data.ok === 1) {
                    statusEl.innerText = 'Lấy dữ liệu thành công!';
                    data.dssv.forEach(sv => {
                        const li = document.createElement('li');
                        li.innerHTML = `<strong>Họ tên:</strong> ${sv.name} | <strong>Số tiền:</strong> ${sv.money} VNĐ`;
                        listEl.appendChild(li);
                    });
                } else {
                    statusEl.innerText = 'API trả về trạng thái thất bại.';
                }
            } catch (error) {
                console.error(error);
                statusEl.innerText = 'Lỗi kết nối tới API!';
            }
        }
    </script>
</body>
</html>

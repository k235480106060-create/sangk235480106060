version: '3.8'

services:
nginx:
image: nginx:latest
container_name: web_nginx
restart: always
ports:
- "80:80"
- "443:443"
volumes:
- ./nginx/default.conf:/etc/nginx/conf.d/default.conf
- ./nginx/web1:/usr/share/nginx/html/web1
- ./nginx/web2:/usr/share/nginx/html/web2

nodered:
image: nodered/node-red:latest
container_name: web_nodered
restart: always
ports:
- "1880:1880"
volumes:
- ./nodered_data:/data

mariadb:
image: mariadb:latest
container_name: web_db
restart: always
environment:
MYSQL_ROOT_PASSWORD: rootpassword
MYSQL_DATABASE: web_db
MYSQL_USER: devuser
MYSQL_PASSWORD: devpassword
ports:
- "3306:3306"
volumes:
- db_data:/var/lib/mysql

phpmyadmin:
image: phpmyadmin:latest
container_name: web_phpmyadmin
restart: always
ports:
- "8080:80"
environment:
PMA_HOST: mariadb
MYSQL_ROOT_PASSWORD: rootpassword

cloudflared:
image: cloudflare/cloudflared:latest
container_name: web_tunnel
restart: always
command: tunnel --no-autoupdate run --token YOUR_CLOUDFLARE_TUNNEL_TOKEN
volumes:
db_data:
